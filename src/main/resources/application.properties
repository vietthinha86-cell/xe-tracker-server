spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/xe_tracker_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
server.port=${PORT:8080}

app.auth.secret=${APP_AUTH_SECRET:XeTracker_LocalDev_ChangeMe_KeepMin32Bytes_2026!}
app.admin.username=${APP_ADMIN_USER:admin}
app.admin.password=${APP_ADMIN_PASS:admin123}

app.jt808.enabled=${JT808_ENABLED:true}
app.jt808.port=${JT808_PORT:6808}

# Tiết kiệm 4G SIM & dung lượng lưu trữ (chỉ lưu clip sự kiện / theo yêu cầu & tự xóa clip cũ)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
app.media.dir=${MEDIA_DIR:./data/media}
app.media.max-clips-per-vehicle=${MEDIA_MAX_CLIPS_PER_VEHICLE:30}
